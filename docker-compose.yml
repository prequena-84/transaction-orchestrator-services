services:
  development:
    container_name: "transaction-orchestrator-services-development"
    image: dev
    build:
      context: .
      target: development
    env_file:
      - .env.development
    ports:
      - "3000:3000"
    networks:
      - banking-network
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  production:
    container_name: "transaction-orchestrator-services-production"
    image: prod
    build:
      context: .
      target: production
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    networks:
      - banking-network
    restart: unless-stopped

networks:
  banking-network:
    external: true 